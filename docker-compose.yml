version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      # GROQ_API_KEY must be passed when running: GROQ_API_KEY=xxx docker-compose up
      - GROQ_API_KEY=${GROQ_API_KEY}
